name: Terraform CI/CD

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-latest

    env:
      TF_VAR_owner: "abdel-benslimane"
      TF_VAR_location: "francecentral"
      TF_VAR_resource_group_name: "abenslimaneRG"

      TF_VAR_app_service_plan_name: "plan-npr-prf2026"
      TF_VAR_app_service_plan_resource_group: "rg-shared-prf2026"

      TF_VAR_storage_account_name: "stabenslimanequiz"
      TF_VAR_key_vault_name: "kv-abenslimane-quiz"

      TF_VAR_postgresql_server_name: "psql-abenslimane-quiz"

      TF_VAR_backend_app_name: "app-abenslimane-quiz"
      TF_VAR_frontend_app_name: "swa-abenslimane-quiz"

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Installer Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.7

      - name: Vérifier le format Terraform
        run: terraform fmt -check -recursive

      - name: Connexion à Azure avec OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Initialiser Terraform
        run: |
          terraform init \
            -backend-config="resource_group_name=abenslimaneRG" \
            -backend-config="storage_account_name=stabenslimanequiz" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=terraform.tfstate" \
            -backend-config="use_oidc=true" \
            -backend-config="use_azuread_auth=true"

      - name: Valider la configuration Terraform
        run: terraform validate

      - name: Créer le plan Terraform
        run: terraform plan -input=false

      - name: Appliquer l’infrastructure Terraform
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: terraform apply -auto-approve -input=false
        